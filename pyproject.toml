[project]
name = "metronome"
version = "0.1.0"
description = "A minimal metronome in the terminal"
readme = "README.md"
authors = [
    { name = "Mimi Wang", email = "mimikwang@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.3",
    "sounddevice>=0.5.6",
]

[project.scripts]
metronome = "metronome:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "ty>=0.0.84",
]
